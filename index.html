<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A home for upcoming apps and projects by Harr1l.">
    <title>Harr1l — Upcoming Projects</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 38rem;
        padding: 3rem 1.5rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 8vw, 4rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
        color: #4b5568;
        font-size: 1.125rem;
        line-height: 1.7;
      }

      .eyebrow {
        margin-bottom: 0.75rem;
        color: #5967d8;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Harr1l · Projects</p>
      <h1>Things are in the works.</h1>
      <p>This is home to my upcoming projects. I’ll publish my apps here as they become available, so check back for updates.</p>
    </main>
  </body>
</html>
